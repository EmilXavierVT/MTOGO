services:
  backend:
    image: "${MTOGO_BACKEND_IMAGE:-mtogo-backend:monitoring}"
    build: .
    environment:
      MTOGO_METRICS_PORT: "9464"
    expose:
      - "9464"

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MTOGO_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.3.2
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${MTOGO_GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${MTOGO_GRAFANA_PASSWORD:?Set MTOGO_GRAFANA_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
