name: Deploy Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  IMAGE: emilxvt/mtogo

jobs:
  release:
    name: Publish Versioned Image
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid SemVer version"
            exit 1
          fi

          git fetch origin main --tags

          SHA=$(git rev-parse --verify "refs/tags/$VERSION^{commit}") || {
            echo "::error::Release tag does not exist"
            exit 1
          }

          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Release commit is not on main"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release: $VERSION"
          echo "Commit: $SHA"

      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          RUN_COUNT=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")] | length')

          if [[ "$RUN_COUNT" -eq 0 ]]; then
            echo "::error::No successful CI run found for commit $SHA"
            exit 1
          fi

          echo "CI verified successfully for $SHA"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Docker image exists
        id: source
        env:
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          SOURCE="$IMAGE:sha-$SHA"

          DETAILS=$(docker buildx imagetools inspect "$SOURCE") || {
            echo "::error::Docker image does not exist or cannot be accessed"
            exit 1
          }

          DIGEST=$(echo "$DETAILS" | awk '/^Digest:/ {print $2; exit}')

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve source image digest"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Source image: $SOURCE"
          echo "Digest: $DIGEST"

      - name: Prevent release tag overwrite
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::Release $VERSION already exists"
            exit 1
          fi

          echo "Release tag $VERSION is available"

      - name: Publish versioned image
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.source.outputs.digest }}
        shell: bash
        run: |
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE@$DIGEST"

          echo "Published $IMAGE:$VERSION"

      - name: Verify release image
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_DIGEST: ${{ steps.source.outputs.digest }}
        shell: bash
        run: |
          DETAILS=$(docker buildx imagetools inspect "$IMAGE:$VERSION")

          ACTUAL_DIGEST=$(echo "$DETAILS" | awk '/^Digest:/ {print $2; exit}')

          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::Release image digest mismatch"
            exit 1
          fi

          echo "Release verified successfully"
          echo "Image: $IMAGE:$VERSION"
          echo "Digest: $ACTUAL_DIGEST"
