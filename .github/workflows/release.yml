name: Publish Versioned Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git version tag (e.g. v0.2.1)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dockerhub-publish-main
  queue: max

env:
  IMAGE: emilxvt/mtogo

jobs:
  release:
    name: Verify or promote an existing version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify the tagged main commit and reuse its exact image digest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAKT_ENABLED: ${{ vars.TAKT_ENABLED }}
        run: |
          python3 - <<'PYTHON'
          import os, sys
          sys.path.insert(0, 'scripts')
          import takt
          from publish_images import digest, ensure_tag
          version = os.environ['VERSION']
          takt.parse_version(version)
          takt.git('fetch', 'origin', 'main', '--tags')
          sha = takt.git('rev-parse', '--verify', f'refs/tags/{version}^{{commit}}')
          takt.git('merge-base', '--is-ancestor', sha, 'origin/main')
          repo = takt.repository()
          if os.environ.get('TAKT_ENABLED') == 'true':
              takt.verified_plan(repo, sha)
          else:
              runs = takt.pages(f'repos/{repo}/actions/workflows/ci.yml/runs?head_sha={sha}&event=push&branch=main', 'workflow_runs')
              latest = max(runs, key=lambda run: (run['run_number'], run['run_attempt']), default={})
              if latest.get('conclusion') != 'success':
                  raise SystemExit('CI has not passed for this release SHA')
          image = os.environ['IMAGE']
          expected = digest(f'{image}:sha-{sha}')
          if not expected:
              raise SystemExit('The SHA image has not been published')
          ensure_tag(image, version, expected)
          print(f'Verified {version}: {sha} -> {image}@{expected}')
          PYTHON
