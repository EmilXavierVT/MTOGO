name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MTOGO_DB_PASSWORD: ci-only-database-password
      MTOGO_SECRET_KEY: ci-only-jwt-signing-key-do-not-use-in-production
      MTOGO_BACKEND_IMAGE: mtogo-backend-ci:${{ github.sha }}
      MTOGO_BACKEND_CONTAINER_NAME: mtogo-ci-backend
      MTOGO_BIND_IP: 127.0.0.1
      MTOGO_BACKEND_PORT: '17070'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Run tests and quality gates
        run: |
          mvn --batch-mode --no-transfer-progress clean verify
          test -s target/site/jacoco/jacoco.xml || {
            echo "::error::JaCoCo coverage report is missing"
            exit 1
          }

      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-quality-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pmd.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build production image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: ${{ env.MTOGO_BACKEND_IMAGE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Verify production startup with PostgreSQL
        shell: bash
        run: |
          docker compose --project-name mtogo-ci up --detach --wait --wait-timeout 120 db backend
          test "$(curl --fail --silent --show-error http://127.0.0.1:17070/)" = "Server running"
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/auth-response.json" \
            --write-out '%{http_code}' http://127.0.0.1:17070/api/auth/me)
          test "$status" = 401
          python3 -c 'import json, sys; assert "error" in json.load(open(sys.argv[1]))' \
            "$RUNNER_TEMP/auth-response.json"

      - name: Show container diagnostics on failure
        if: failure()
        run: docker compose --project-name mtogo-ci logs --no-color --tail 100 backend db

      - name: Remove isolated smoke-test containers and data
        if: always()
        run: docker compose --project-name mtogo-ci down --volumes --remove-orphans

  quality:
    name: Static analysis
    uses: ./.github/workflows/mega-linter.yml

  checks:
    name: CI checks
    if: always()
    needs: [backend, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      BACKEND_RESULT: ${{ needs.backend.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
    steps:
      - name: Require every verification job to pass
        run: test "$BACKEND_RESULT" = success && test "$QUALITY_RESULT" = success

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks]
    uses: ./.github/workflows/docker-publish.yml
    with:
      source_sha: ${{ github.sha }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
