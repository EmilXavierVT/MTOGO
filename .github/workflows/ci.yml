name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend Build & Test
    if: github.event_name != 'push' || vars.TAKT_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mtogo_courier_test
          POSTGRES_USER: courier_test
          POSTGRES_PASSWORD: courier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courier_test -d mtogo_courier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify application and delivery tooling
        env:
          MVNW_VERBOSE: 'true'
          MTOGO_COURIER_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/mtogo_courier_test
        run: ./scripts/check.sh verify
